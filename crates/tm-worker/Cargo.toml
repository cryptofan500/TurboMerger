[package]
name = "tm-worker"
description = "TurboMerger worker host: crash-isolated subprocesses with a JSON-lines protocol, watchdog, memory cap and kill-on-cancel"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
edition = "2021"
publish = false

[[bin]]
# The host's own test double: echo, progress, hang, oom and crash modes.
name = "tm-test-worker"
path = "src/bin/tm-test-worker.rs"

[dependencies]
tm-core.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
