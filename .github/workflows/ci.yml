name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: macOS Apple Silicon
            os: macos-15
          - name: Linux x64
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Confirm native Apple Silicon runner
        if: runner.os == 'macOS'
        shell: bash
        run: test "$(rustc --print host-tuple)" = "aarch64-apple-darwin"

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Run static checks and tests
        run: npm run verify

      - name: Validate the Tauri application build
        run: npm run tauri:build -- --debug --no-bundle

      # Plan §6 L6: the desktop app clicked through in a virtual display
      # (merge, curate, apply-back confirmations + restore, cancel, watch).
      - name: GUI smoke (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y webkit2gtk-driver xvfb
          cargo install tauri-driver --version 2.0.6 --locked
          python3 -m venv "$RUNNER_TEMP/gui-venv"
          "$RUNNER_TEMP/gui-venv/bin/pip" install --quiet selenium==4.49.0
          xvfb-run -a -s "-screen 0 1280x1024x24" "$RUNNER_TEMP/gui-venv/bin/python" \
            fixtures/gui-smoke/gui_smoke.py target/debug/turbomerger-gui "$RUNNER_TEMP/gui"

      # Phase 2 gate: the Windows CLI is a console program — it prints and a
      # shell gets its exit code (N-29; v7 was a GUI-subsystem binary).
      - name: CLI prints and returns exit codes (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tm = "target\debug\turbomerger.exe"
          $v = & $tm --version
          if ($LASTEXITCODE -ne 0 -or $v -notmatch '^turbomerger ') { throw "--version: '$v' exit $LASTEXITCODE" }
          New-Item -ItemType Directory -Path smoke\src -Force | Out-Null
          Set-Content -Path smoke\src\main.rs -Value 'fn main() {}'
          $out = & $tm merge smoke\src smoke\out.md
          if ($LASTEXITCODE -ne 0 -or -not ($out -match '^merged=1 ')) { throw "merge: '$out' exit $LASTEXITCODE" }
          & $tm merge smoke\missing smoke\x.md 2>$null
          if ($LASTEXITCODE -ne 1) { throw "missing source should exit 1, got $LASTEXITCODE" }
          & $tm merge smoke\src --no-such-flag 2>$null
          if ($LASTEXITCODE -ne 2) { throw "usage error should exit 2, got $LASTEXITCODE" }
          exit 0  # the runner otherwise exits with the last $LASTEXITCODE (2)

      - name: Static musl CLI runs in Alpine (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked --target x86_64-unknown-linux-musl -p tm-cli
          bin=target/x86_64-unknown-linux-musl/release/turbomerger
          file "$bin" | grep -q 'static'
          docker run --rm -v "$PWD/target/x86_64-unknown-linux-musl/release:/w:ro" alpine:3 /w/turbomerger --version
