[package]
name = "tm-gui"
description = "TurboMerger desktop app (Tauri shell over tm-core)"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
edition = "2021"
publish = false

[lib]
name = "tm_gui"
path = "src/lib.rs"

# The desktop app. The console command line is `turbomerger` (apps/tm-cli);
# see docs/adr/0015-two-binaries.md.
[[bin]]
name = "turbomerger-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tm-core.workspace = true
tm-cli.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
dirs.workspace = true
open.workspace = true
notify.workspace = true
notify-debouncer-mini.workspace = true

[dev-dependencies]
tempfile.workspace = true
