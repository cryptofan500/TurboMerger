[workspace]
resolver = "2"
members = ["crates/tm-core", "crates/tm-worker", "apps/tm-cli", "apps/tm-mcp", "src-tauri"]

[workspace.package]
version = "7.7.0"
authors = ["TurboMerger Contributors"]
license = "MIT"
repository = "https://github.com/cryptofan500/TurboMerger"
rust-version = "1.92"

# One pin per dependency for every crate in the workspace.
[workspace.dependencies]
tm-core = { path = "crates/tm-core" }
tm-cli = { path = "apps/tm-cli" }
tm-mcp = { path = "apps/tm-mcp" }
tm-worker = { path = "crates/tm-worker" }

aho-corasick = "1.1"
anyhow = "1"
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
chardetng = "1.0.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
# Graceful Ctrl-C for the CLI (cancel the job, clean up temp files).
ctrlc = "3.5"
dirs = "6"
# canonicalize without Windows `\\?\` prefixes (N-41; clippy.toml bans std's)
dunce = "1.0.5"
encoding_rs = "0.8.35"
globset = "0.4"
ignore = "0.4"
libc = "0.2"
# The CLI's allocator: musl's malloc serializes threads (ADR 0002, plan §16).
mimalloc = { version = "0.1.52", default-features = false }
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"
open = "5"
phf = { version = "0.13", features = ["macros"] }
rayon = "1.10"
# MCP SDK (N-19, ADR 0014): protocol versions, progress and cancellation.
rmcp = { version = "=3.4.1", default-features = false, features = ["server", "macros", "transport-io"] }
regex = "1"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# OCR cache keys: the SHA-256 of a picture's bytes (P7).
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "io-std", "sync", "time"] }
tiktoken-rs = "0.12"
toml = "1"
# Content hashes for the token-count cache (plan 2.8).
twox-hash = { version = "2.1", default-features = false, features = ["xxhash3_128", "xxhash3_64", "std"] }
tree-sitter = "0.26.11"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
unicode-normalization = "0.1"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

# Document text extraction (Phase 3, ADR 0005). All pure-Rust, so the three
# OSes behave identically and the product stays offline (ADR 0006) and
# bit-rot-resistant (ADR 0002, Class 2): no native PDF library, no Python.
#   pdf_oxide  — PDF text, reading-order aware; text-only feature set (no ICC,
#                rendering or system fonts), legacy-crypto kept so MD5/RC4
#                encrypted PDFs still open. PDFium rendering of figure crops is
#                a later step (the `table-ml`/`rendering` features, tm-worker).
#   calamine   — xls/xlsx/xlsb/ods spreadsheets.
#   zip + quick-xml — docx/pptx/odt/odp/epub (a zip of XML parts).
calamine = "0.36.1"
pdf_oxide = { version = "0.3.78", default-features = false, features = ["legacy-crypto"] }
quick-xml = "0.42.0"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
#   flate2     — gzip-compressed text (`notes.txt.gz`, `.tar.gz`), streamed.
#   cfb        — the OLE container of legacy Word/PowerPoint (`.doc`, `.ppt`).
flate2 = "1.1.9"
cfb = "0.7.3"

# Profiles are only honoured at the workspace root.
[profile.release]
# "unwind", not "abort": a parser panic on one malformed file must cost that
# file, not the whole run (ADR 0018, S8: 2 of 120 corrupted PDFs aborted a
# release merge with no output; the per-file guard in merger/process.rs
# needs unwinding to catch them).
panic = "unwind"
codegen-units = 1
lto = true
# 3, not "z": 25-30 % faster merges for +8 % binary size (ADR 0016, N-39).
opt-level = 3
strip = true
overflow-checks = true  # SECURITY: Prevent integer overflow in release builds
