[workspace]
resolver = "2"
members = ["crates/tm-core", "apps/tm-cli", "apps/tm-mcp", "src-tauri"]

[workspace.package]
version = "7.7.0"
authors = ["TurboMerger Contributors"]
license = "MIT"
repository = "https://github.com/cryptofan500/TurboMerger"
rust-version = "1.92"

# One pin per dependency for every crate in the workspace.
[workspace.dependencies]
tm-core = { path = "crates/tm-core" }
tm-cli = { path = "apps/tm-cli" }
tm-mcp = { path = "apps/tm-mcp" }

aho-corasick = "1.1"
anyhow = "1"
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
chardetng = "1.0.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
# Graceful Ctrl-C for the CLI (cancel the job, clean up temp files).
ctrlc = "3.5"
dirs = "6"
encoding_rs = "0.8.35"
globset = "0.4"
ignore = "0.4"
libc = "0.2"
# The CLI's allocator: musl's malloc serializes threads (ADR 0002, plan §16).
mimalloc = { version = "0.1.52", default-features = false }
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"
open = "5"
phf = { version = "0.13", features = ["macros"] }
rayon = "1.10"
# MCP SDK (N-19, ADR 0014): protocol versions, progress and cancellation.
rmcp = { version = "=3.4.1", default-features = false, features = ["server", "macros", "transport-io"] }
regex = "1"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "io-std", "sync", "time"] }
tiktoken-rs = "0.12"
toml = "1"
tree-sitter = "0.26.11"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
unicode-normalization = "0.1"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

# Profiles are only honoured at the workspace root.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
overflow-checks = true  # SECURITY: Prevent integer overflow in release builds
