[package]
name = "tm-cli"
description = "TurboMerger command line (console binary `turbomerger`)"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
edition = "2021"
publish = false

[[bin]]
name = "turbomerger"
path = "src/main.rs"

[dependencies]
tm-core.workspace = true
tm-mcp.workspace = true
clap.workspace = true
clap_complete.workspace = true
ctrlc.workspace = true
dunce.workspace = true
mimalloc.workspace = true
# big PDFs parse in a worker process (src/pdf_worker.rs)
tm-worker.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
# physical memory for the PDF worker's cap; Linux prctl / OOM score
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
